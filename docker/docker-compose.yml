networks:
  api-server:

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      - POSTGRES_USER=test
      - POSTGRES_PASSWORD=test
      - POSTGRES_DB=sss-computing
    volumes:
      - ./postgres:/var/lib/postgresql/data
      - ../sql/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ../sql/:/sql/
    ports:
      - 8081:5432
    networks:
      - api-server

  api:
    build: ./api-server
    ports:
      - 8080:8080
    volumes:
      - /home/konstantin/code/rust-proj/sss-computing-strength/target/debug/sss-computing-strength:/package/sss-computing-strength
      - ./log.txt:/package/log.txt
    networks:
      - api-server

  # client:
  #   build: ./client
  #   environment:
  #     DISPLAY: ${DISPLAY}
  #   network_mode: host
